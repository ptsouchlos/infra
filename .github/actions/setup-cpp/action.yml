name: Set up C++
description: Install a C++ compiler, CMake and Ninja, and export CC/CXX (and optionally VCPKG_ROOT).
inputs:
  compiler:
    description: "Compiler: gcc or clang (Linux), appleclang (macOS), msvc or clang (Windows)."
    required: true
  version:
    description: Compiler major version on Linux (for example 14). Empty uses the distro default.
    default: ""
  cmake-version:
    description: Exact CMake version to install with pip. Empty keeps the runner's CMake.
    default: ""
  vcpkg:
    description: Export VCPKG_ROOT, cloning and bootstrapping vcpkg unless the job already set it.
    default: "false"
runs:
  using: composite
  steps:
    - name: Install toolchain
      shell: bash
      env:
        COMPILER: ${{ inputs.compiler }}
        VERSION: ${{ inputs.version }}
        CMAKE_VERSION: ${{ inputs.cmake-version }}
        VCPKG: ${{ inputs.vcpkg }}
      run: bash "${{ github.action_path }}/install.sh"
    - name: Set up the MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
