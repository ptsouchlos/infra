name: Set up Rust
description: Install a Rust toolchain with rustup, cache cargo output, and optionally install just.
inputs:
  toolchain:
    description: Toolchain to install and make the default.
    default: stable
  components:
    description: Space-separated rustup components.
    default: rustfmt clippy
  targets:
    description: Space-separated rustup targets to install; a Linux -musl target also installs musl-tools.
    default: ""
  just:
    description: Also install just.
    default: "false"
runs:
  using: composite
  steps:
    - name: Install the toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
        RUNNER_OS: ${{ runner.os }}
      run: bash "${{ github.action_path }}/install.sh"
    - name: Cache cargo output
      uses: Swatinem/rust-cache@v2
    - name: Install just
      if: inputs.just == 'true'
      uses: extractions/setup-just@v4
