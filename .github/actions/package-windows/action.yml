name: Package a Windows installer
description: Build an .msi with WiX (v4 or later) from a caller-supplied .wxs and a directory of prebuilt binaries, write a .sha256, and optionally upload both to a GitHub release. Windows runners only. Signing is not done yet.
inputs:
  bin-dir:
    description: Directory holding the prebuilt binaries, for example the cargo-release bin-dir output. The .wxs reads it as $(BinDir).
    required: true
  wxs:
    description: "Path to the WiX source. It receives the preprocessor variables $(BinDir) and $(Version), so it needs no hard-coded paths or versions."
    required: true
  version:
    description: App version, without a leading v. Any prerelease or build suffix is dropped for the MSI version, which allows only dotted numbers.
    required: true
  name:
    description: Asset base name; the installer is written as <name>.msi.
    required: true
  arch:
    description: Target architecture for wix build, x64 or arm64.
    default: x64
  defines:
    description: Extra WiX preprocessor definitions, one NAME=value per line.
    default: ""
  accept-eula:
    description: "WiX Open Source Maintenance Fee EULA id to accept, passed as `wix build -acceptEula <id>`. WiX 7 requires it (wix7); the EULA exempts projects earning under US$10,000 a year and asks for a maintenance fee beyond that. Left empty on purpose: the caller accepts the terms, not this action. Not needed for WiX 5 and earlier."
    default: ""
  wix-version:
    description: WiX dotnet tool version to install. 4.x and 5.x are MS-RL with no fee; WiX 6 and later fall under the Open Source Maintenance Fee, and 7 needs accept-eula.
    default: 7.0.1
  sign-cert:
    description: Optional Authenticode PFX certificate (base64-encoded contents or path to a .pfx file). Signs binaries before wix build and the .msi after it.
    default: ""
  sign-password:
    description: Password for sign-cert, if the PFX is password-protected.
    default: ""
  sign-timestamp-url:
    description: RFC 3161 timestamp server URL passed to signtool /tr.
    default: http://timestamp.digicert.com
  out-dir:
    description: Directory the msi and checksum are written to.
    default: dist
  release:
    description: Upload the msi and checksum to the GitHub release for the current tag.
    default: "false"
outputs:
  asset:
    description: Path of the .msi.
    value: ${{ steps.pkg.outputs.asset }}
  checksum:
    description: Path of the msi's .sha256 file.
    value: ${{ steps.pkg.outputs.checksum }}
runs:
  using: composite
  steps:
    - name: Install WiX
      shell: bash
      env:
        WIX_VERSION: ${{ inputs.wix-version }}
      run: bash "${{ github.action_path }}/install.sh"
    - name: Package
      id: pkg
      shell: bash
      env:
        BIN_DIR: ${{ inputs.bin-dir }}
        WXS: ${{ inputs.wxs }}
        NAME: ${{ inputs.name }}
        VERSION: ${{ inputs.version }}
        ARCH: ${{ inputs.arch }}
        EXTRA_DEFINES: ${{ inputs.defines }}
        WIX_ACCEPT_EULA: ${{ inputs.accept-eula }}
        SIGN_CERT: ${{ inputs.sign-cert }}
        SIGN_PASSWORD: ${{ inputs.sign-password }}
        SIGN_TIMESTAMP_URL: ${{ inputs.sign-timestamp-url }}
        OUT_DIR: ${{ inputs.out-dir }}
      run: bash "${{ github.action_path }}/package.sh"
    - name: Upload to the release
      if: inputs.release == 'true'
      uses: softprops/action-gh-release@v3.0.4
      with:
        files: |
          ${{ steps.pkg.outputs.asset }}
          ${{ steps.pkg.outputs.checksum }}
        prerelease: ${{ contains(github.ref_name, '-') }}
