name: Check Rust
description: Run cargo fmt --check, clippy and tests.
inputs:
  working-directory:
    description: Directory containing Cargo.toml.
    default: "."
  fmt:
    description: Run cargo fmt --check.
    default: "true"
  clippy:
    description: Run cargo clippy.
    default: "true"
  clippy-args:
    description: Arguments after -- for clippy.
    default: -D warnings
  test:
    description: Run cargo test.
    default: "true"
  args:
    description: Extra cargo arguments for clippy and test (not fmt), space-separated (no embedded spaces within one argument, so use --features=a,b).
    default: ""
runs:
  using: composite
  steps:
    - name: Check
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        RUN_FMT: ${{ inputs.fmt }}
        RUN_CLIPPY: ${{ inputs.clippy }}
        CLIPPY_ARGS: ${{ inputs.clippy-args }}
        RUN_TESTS: ${{ inputs.test }}
        ARGS: ${{ inputs.args }}
      run: bash "${{ github.action_path }}/run.sh"
