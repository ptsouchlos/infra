name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the unit tests
        shell: bash
        run: python -m unittest discover -s tests

  # Generates each demo project from tests/templates and drives it through the composite actions.
  cpp:
    name: ${{ matrix.kind }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        kind: [cpp-basic, cpp-hardening, cpp-sanitizers, cpp-install, cpp-cpm]
        platform: [linux-gcc, linux-clang, macos-appleclang, windows-msvc, windows-clang]
        # Each include entry names its platform, so it adds os/compiler to every kind on that platform.
        include:
          - { platform: linux-gcc, os: ubuntu-latest, compiler: gcc, version: "14" }
          - { platform: linux-clang, os: ubuntu-latest, compiler: clang, version: "18" }
          - { platform: macos-appleclang, os: macos-latest, compiler: appleclang }
          - { platform: windows-msvc, os: windows-latest, compiler: msvc }
          - { platform: windows-clang, os: windows-latest, compiler: clang }
        exclude:
          - { kind: cpp-sanitizers, platform: windows-msvc }
          - { kind: cpp-sanitizers, platform: windows-clang }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate the demo project
        shell: bash
        run: python tests/generate.py ${{ matrix.kind }} _demo/${{ matrix.kind }}
      - uses: ./.github/actions/setup-cpp
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
      - uses: ./.github/actions/cmake-build
        with:
          source-dir: _demo/${{ matrix.kind }}
          build-dir: _demo/${{ matrix.kind }}/build
          install-prefix: ${{ matrix.kind == 'cpp-install' && format('{0}/_demo/cpp-install/prefix', github.workspace) || '' }}
          cpm-cache: "true"
      - name: Build the cpp-install consumer
        if: matrix.kind == 'cpp-install'
        uses: ./.github/actions/cmake-build
        with:
          source-dir: _demo/cpp-install/consumer
          build-dir: _demo/cpp-install/build/consumer
          configure-args: -DCMAKE_PREFIX_PATH=${{ github.workspace }}/_demo/cpp-install/prefix

  # cpp/presets: the preset's toolchain file picks the compiler; setup-cpp provides Ninja and,
  # on Windows, the MSVC environment.
  presets:
    name: ${{ matrix.kind }} ${{ matrix.preset }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: cpp-presets, os: ubuntu-latest, compiler: gcc, preset: gcc-debug, cxx: GNU }
          - { kind: cpp-presets, os: ubuntu-latest, compiler: clang, preset: clang-maxsan, cxx: Clang }
          - { kind: cpp-presets, os: ubuntu-latest, compiler: clang, preset: clang-libcxx-debug, cxx: Clang, install: "sudo apt-get install -y libc++-dev libc++abi-dev" }
          - { kind: cpp-presets, os: ubuntu-latest, compiler: gcc, preset: composed, cxx: GNU }
          - { kind: cpp-presets, os: macos-latest, compiler: appleclang, preset: appleclang-debug, cxx: AppleClang }
          - { kind: cpp-presets, os: macos-latest, compiler: appleclang, preset: appleclang-maxsan, cxx: AppleClang }
          - { kind: cpp-presets, os: windows-latest, compiler: msvc, preset: msvc-debug, cxx: MSVC }
          - { kind: cpp-presets, os: windows-latest, compiler: clang, preset: clang-release, cxx: Clang }
          # The runner images ship vcpkg on Linux and Windows (VCPKG_INSTALLATION_ROOT).
          - { kind: cpp-vcpkg, os: ubuntu-latest, compiler: gcc, preset: gcc-debug-vcpkg, cxx: GNU }
          - { kind: cpp-vcpkg, os: windows-latest, compiler: msvc, preset: msvc-debug-vcpkg, cxx: MSVC }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-cpp
        with:
          compiler: ${{ matrix.compiler }}
      - name: Install tools
        if: matrix.install != ''
        shell: bash
        run: ${{ matrix.install }}
      - name: Point VCPKG_ROOT at the runner's vcpkg
        if: matrix.kind == 'cpp-vcpkg'
        shell: bash
        run: echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT//\\//}" >> "$GITHUB_ENV"
      - name: Run the demo project
        shell: bash
        run: python tests/run.py ${{ matrix.kind }} --set PRESET=${{ matrix.preset }} --set CXX_ID=${{ matrix.cxx }} --verbose

  # setup-cpp with vcpkg: true clones and bootstraps vcpkg and exports VCPKG_ROOT.
  setup-vcpkg:
    name: setup-cpp vcpkg (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: gcc }
          - { os: macos-latest, compiler: appleclang }
          - { os: windows-latest, compiler: msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cpp
        with:
          compiler: ${{ matrix.compiler }}
          vcpkg: "true"
      - name: Run the bootstrapped vcpkg
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          "$VCPKG_ROOT/vcpkg" version

  # cmake.just runs on each OS's default generator (Visual Studio on Windows), so no setup-cpp here.
  cpp-just:
    name: cpp-just (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v4
      - name: Run the cpp-just demo project
        run: python tests/run.py cpp-just --verbose
      - name: Run the cpp-just demo project through presets
        run: python tests/run.py cpp-just-presets --verbose

  # The just recipes use the [doc] attribute, which arrived in just 1.27.0.
  just-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.27.0"
      - uses: ./.github/actions/setup-rust
      - name: Run the just kinds on the oldest supported just
        shell: bash
        run: |
          just --version
          python tests/run.py cpp-just
          python tests/run.py cpp-just-presets
          python tests/run.py rust-basic

  # Module kinds that need no compiler setup; each entry picks its tools and arguments.
  modules:
    name: ${{ matrix.kind }} (${{ matrix.os }}${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: cpp-cache, os: ubuntu-latest, label: "", install: "sudo apt-get install -y ccache" }
          - { kind: cpp-cache, os: macos-latest, label: "", install: "brew install ccache" }
          - { kind: cpp-linker, os: ubuntu-latest, label: " lld", install: "sudo apt-get install -y lld", args: "--set LINKER=LLD --set LINK_FLAG=-fuse-ld=lld" }
          - { kind: cpp-linker, os: ubuntu-latest, label: " default", args: "" }
          - { kind: cpp-linker, os: macos-latest, label: "", args: "" }
          - { kind: cpp-linker, os: windows-latest, label: "", args: "" }
          - { kind: cpp-static-analyzers, os: ubuntu-latest, label: " clang", install: "sudo apt-get install -y cppcheck clang-tidy iwyu", args: "--cmake-arg=-DCMAKE_CXX_COMPILER=clang++" }
          - { kind: cpp-static-analyzers, os: ubuntu-latest, label: " gcc", install: "sudo apt-get install -y cppcheck clang-tidy iwyu", args: "--cmake-arg=-DCMAKE_CXX_COMPILER=g++" }
          - { kind: cpp-static-analyzers-error, os: ubuntu-latest, label: "", install: "sudo apt-get install -y cppcheck", args: "" }
          - { kind: cpp-ipo, os: ubuntu-latest, label: "", args: "" }
          - { kind: cpp-ipo, os: macos-latest, label: "", args: "" }
          - { kind: cpp-ipo, os: windows-latest, label: "", args: "--set IPO_FLAG=" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        if: matrix.install != ''
        shell: bash
        run: ${{ matrix.install }}
      - name: Run the demo project
        shell: bash
        run: python tests/run.py ${{ matrix.kind }} ${{ matrix.args }} --verbose

  # The telemetry module needs CMake 4.3, which setup-cpp installs from the pip wheel.
  telemetry:
    name: cpp-telemetry (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-gcc, os: ubuntu-latest, compiler: gcc, version: "14" }
          - { platform: macos-appleclang, os: macos-latest, compiler: appleclang }
          - { platform: windows-msvc, os: windows-latest, compiler: msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-cpp
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
          cmake-version: "4.3.0"
      - name: Install jq
        if: matrix.os == 'macos-latest'
        run: brew install jq
      - name: Show the tools the callback needs
        shell: bash
        run: |
          cmake --version
          jq --version
          which -a bash
      - name: Run the demo project
        shell: bash
        run: python tests/run.py cpp-telemetry --verbose

  # import std needs CMake 4.3, Ninja and a toolchain that ships the std module. gcc 15 is not
  # packaged for Ubuntu 24.04 (noble), so Linux uses the explicit ubuntu-26.04 label.
  import-std:
    name: cpp-import-std (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-gcc, os: ubuntu-26.04, compiler: gcc, version: "15" }
          - { platform: windows-msvc, os: windows-latest, compiler: msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-cpp
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
          cmake-version: "4.3.0"
      - name: Run the demo project
        shell: bash
        run: python tests/run.py cpp-import-std --verbose

  rust:
    name: rust-basic (${{ matrix.os }}, ${{ matrix.toolchain }}${{ matrix.args && ' args' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        # A base value, so the args leg below is a new job rather than merged into ubuntu/stable.
        args: [""]
        include:
          - { os: ubuntu-latest, toolchain: beta }
          - { os: ubuntu-latest, toolchain: "1.85" }   # oldest probed: first edition-2024 compiler
          - { os: ubuntu-latest, toolchain: stable, args: "--workspace --all-features" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate the demo project
        run: python tests/generate.py rust-basic _demo/rust-basic
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
          just: "true"
      - uses: ./.github/actions/cargo-check
        with:
          working-directory: _demo/rust-basic
          args: ${{ matrix.args }}
      - name: Run the infra just recipes
        working-directory: _demo/rust-basic
        run: |
          just format
          just lint

  rust-release:
    name: rust-release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate the demo project
        run: python tests/generate.py rust-basic _demo/rust-basic
      - uses: ./.github/actions/setup-rust
        with:
          components: ""
          targets: ${{ matrix.target }}
      - name: Read the binary name
        id: bin
        shell: bash
        run: echo "name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' _demo/rust-basic/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/cargo-release
        id: release
        with:
          target: ${{ matrix.target }}
          bin: ${{ steps.bin.outputs.name }}
          working-directory: _demo/rust-basic
      - name: Verify the way consumers download it
        shell: bash
        run: |
          cd "$(dirname '${{ steps.release.outputs.asset }}')"
          asset="$(basename '${{ steps.release.outputs.asset }}')"
          if command -v sha256sum >/dev/null; then
            sha256sum -c "$asset.sha256"
          else
            shasum -a 256 -c "$asset.sha256"
          fi
          mkdir extracted
          case "$asset" in
            *.zip) 7z x "$asset" -oextracted >/dev/null ;;
            *) tar -xzf "$asset" -C extracted ;;
          esac
          ls extracted
          ./extracted/${{ steps.bin.outputs.name }}*
      - name: Verify the staged binary directory
        shell: bash
        run: |
          dir='${{ steps.release.outputs.bin-dir }}'
          ls "$dir"
          "$dir"/${{ steps.bin.outputs.name }}*

  # package-nfpm on the demo crate: the deb installs on the runner and the rpm in a Fedora
  # container, and the packaged binary runs from /usr/bin in both.
  package-nfpm:
    name: package-nfpm (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, arch: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, arch: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate the demo project
        run: python tests/generate.py rust-basic _demo/rust-basic
      - uses: ./.github/actions/setup-rust
        with:
          components: ""
          targets: ${{ matrix.target }}
      - name: Read the binary name
        id: bin
        shell: bash
        run: echo "name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' _demo/rust-basic/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/cargo-release
        id: release
        with:
          target: ${{ matrix.target }}
          bin: ${{ steps.bin.outputs.name }}
          working-directory: _demo/rust-basic
      - name: Write the nFPM config
        shell: bash
        run: |
          cat > nfpm-demo.yaml <<'EOF'
          name: ${{ steps.bin.outputs.name }}
          arch: ${PKG_ARCH}
          version: ${PKG_VERSION}
          maintainer: infra CI <noreply@example.com>
          description: package-nfpm fixture
          license: LicenseRef-proprietary
          contents:
            - src: ${PKG_BIN_DIR}/${{ steps.bin.outputs.name }}
              dst: /usr/bin/${{ steps.bin.outputs.name }}
              expand: true
          EOF
      - uses: ./.github/actions/package-nfpm
        id: pkg
        with:
          config: nfpm-demo.yaml
          bin-dir: ${{ steps.release.outputs.bin-dir }}
          version: 1.2.3
          arch: ${{ matrix.arch }}
          name: demo-1.2.3-linux-${{ matrix.arch }}
      - name: Verify the checksums
        shell: bash
        run: |
          cd dist
          sha256sum -c demo-1.2.3-linux-${{ matrix.arch }}.deb.sha256
          sha256sum -c demo-1.2.3-linux-${{ matrix.arch }}.rpm.sha256
      - name: Install the deb and run it
        shell: bash
        run: |
          sudo apt-get install -y ./dist/demo-1.2.3-linux-${{ matrix.arch }}.deb
          dpkg-deb -I dist/demo-1.2.3-linux-${{ matrix.arch }}.deb
          ${{ steps.bin.outputs.name }}
      - name: Install the rpm in Fedora and run it
        shell: bash
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest bash -c \
            'dnf install -y --nogpgcheck /dist/demo-1.2.3-linux-${{ matrix.arch }}.rpm && ${{ steps.bin.outputs.name }}'

  # package-appimage on the demo crate: the image runs (extracted, since runners have no FUSE) and
  # starts the main binary by default, and under a second binary's name via a symlink.
  package-appimage:
    name: package-appimage (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, arch: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, arch: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate the demo project
        run: python tests/generate.py rust-basic _demo/rust-basic
      - uses: ./.github/actions/setup-rust
        with:
          components: ""
          targets: ${{ matrix.target }}
      - name: Read the binary name
        id: bin
        shell: bash
        run: echo "name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' _demo/rust-basic/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/cargo-release
        id: release
        with:
          target: ${{ matrix.target }}
          bin: ${{ steps.bin.outputs.name }}
          working-directory: _demo/rust-basic
      - name: Write the desktop file and icon
        shell: bash
        run: |
          cat > demo.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Demo
          Exec=${{ steps.bin.outputs.name }}
          Icon=demo
          Categories=Utility;
          EOF
          python - <<'EOF'
          import struct, zlib
          def chunk(tag, data):
              body = tag + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body))
          rows = b"".join(b"\x00" + b"\x33\x66\xcc" * 64 for _ in range(64))
          png = (b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", 64, 64, 8, 2, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(rows)) + chunk(b"IEND", b""))
          open("demo.png", "wb").write(png)
          EOF
      - uses: ./.github/actions/package-appimage
        id: pkg
        with:
          bin-dir: ${{ steps.release.outputs.bin-dir }}
          exe: ${{ steps.bin.outputs.name }}
          desktop-file: demo.desktop
          icon: demo.png
          arch: ${{ matrix.arch }}
          name: demo-1.2.3-linux-${{ matrix.arch }}
      - name: Verify and run the image
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          cd dist
          sha256sum -c demo-1.2.3-linux-${{ matrix.arch }}.AppImage.sha256
          ./demo-1.2.3-linux-${{ matrix.arch }}.AppImage
          # Naming the binary as the first argument starts it too.
          ./demo-1.2.3-linux-${{ matrix.arch }}.AppImage ${{ steps.bin.outputs.name }}

  # The cargo-build action on every runner and build type; rust-build.yml only wraps it in a matrix.
  rust-build:
    name: rust-build (${{ matrix.os }}, ${{ matrix.build-type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build-type: [debug, release]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate the demo project
        run: python tests/generate.py rust-basic _demo/rust-basic
      - uses: ./.github/actions/setup-rust
        with:
          components: ""
          just: "true"
      - uses: ./.github/actions/cargo-build
        with:
          build-type: ${{ matrix.build-type }}
          working-directory: _demo/rust-basic

  # cargo-deny-action is a Docker action, so this runs on Linux only.
  rust-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate the demo project
        run: python tests/generate.py rust-basic _demo/rust-basic
      - uses: ./.github/actions/cargo-deps
        with:
          working-directory: _demo/rust-basic

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate the demo project
        run: python tests/generate.py docs _demo/docs
      - uses: ./.github/actions/build-docs
        with:
          working-directory: _demo/docs
          html-dir: out/html
