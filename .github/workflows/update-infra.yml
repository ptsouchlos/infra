name: Update infra

# Reusable workflow: a consumer calls it from its own `infra-update.yml`, which owns the triggers
# (repository_dispatch, schedule, workflow_dispatch) because those only fire on the repo itself.
# Reads the caller's `vars.INFRA_BOT_APP_ID` and `secrets.INFRA_BOT_PRIVATE_KEY`.
on:
  workflow_call:
    inputs:
      tag:
        description: Infra release tag. Empty uses the latest non-prerelease release.
        type: string
        default: ""
    secrets:
      INFRA_BOT_PRIVATE_KEY:
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.INFRA_BOT_APP_ID }}
          private-key: ${{ secrets.INFRA_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: ptsouchlos/infra/.github/actions/update-infra@v1
        with:
          token: ${{ steps.app.outputs.token }}
          tag: ${{ inputs.tag }}
