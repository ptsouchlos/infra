name: Release

# Pushing a tag like v1.2.3 moves the floating major tag (v1) to it, so downstream repos that
# reference `ptsouchlos/infra/.github/actions/<name>@v1` pick up the release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Move the major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG"
          git push --force origin "refs/tags/$major"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A release created by hand in the UI already owns the tag; leave it alone.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" --generate-notes --verify-tag
          fi

  notify-consumers:
    # Skipped until the GitHub App is configured, so forks and early releases still work.
    if: vars.INFRA_BOT_APP_ID != ''
    needs: major-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.INFRA_BOT_APP_ID }}
          private-key: ${{ secrets.INFRA_BOT_PRIVATE_KEY }}
          owner: ptsouchlos
      - name: Dispatch to consumers
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/notify-consumers.sh
